<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <header>
        <img src="../Images/icons8-to-do-list-50.png" alt="" class="static-gif">
        <img src="../Images/icons8-to-do-list.gif" alt="">
        
        <h1>To Do List</h1>
    </header>
    <main>
        <div id="projects"> </div>
        <div id="toDoLists">

            <div>
                <table class="toDoTable">
                    <colgroup>
                        <col class="name">
                        <col class="project">
                        <col class="deadline">
                        <col class="prio">
                        <col class="Status">
                    </colgroup>
                    <tr>
                        <th>Name</th>
                        <th>Project</th>
                        <th>Deadline</th>
                        <th>Prio</th>
                        <th>Status</th>
                    </tr>
                
                </table>
                <button class="addToDo">Add ToDo</button>
            </div>

        </div>
    </main>

    <div class="overlay">
        <div class="modal">

            <form action="post" class="form">
                <button type="submit">Submit</button>
            </form>

        </div>

    </div>
</body>
</html>
